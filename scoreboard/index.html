<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scoreboard</title>
    <style>
        :root { --red: #ff0000; --yellow: #fffbe6; }
        body { font-family: ui-monospace, monospace; margin: 0; padding: 20px; background: #fff; color: #000; }
        
        /* Header */
        #top { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
        select { font-family: monospace; font-size: 16px; font-weight: bold; padding: 5px; border: 2px solid #000; }
        #timer-box { font-weight: bold; text-align: right; }

        /* Table Design */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { text-align: left; font-size: 11px; text-transform: uppercase; color: #666; border-bottom: 1px solid #ccc; padding: 8px; }
        td { padding: 15px 8px; border-bottom: 1px solid #eee; cursor: pointer; }
        .live-row { background: var(--yellow); }
        
        /* The Red "IN" Indicator */
        .badge { font-weight: bold; font-size: 11px; padding: 4px 8px; border: 1px solid #000; display: inline-block; }
        .badge-red { background: var(--red); color: #fff; border: none; }

        .team { font-size: 20px; font-weight: 900; }
        .score { font-size: 24px; font-weight: 900; }
        .play { font-size: 12px; font-weight: bold; color: #444; }

        /* Focus Mode */
        #focus { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; color: #fff; z-index: 100; flex-direction: column; align-items: center; justify-content: center;
        }
        #focus.active { display: flex; }
        .f-score { font-size: 180px; font-weight: 900; line-height: 1; margin: 20px 0; }
        .f-clock { font-size: 30px; font-weight: bold; color: var(--red); }
        .f-abbr { font-size: 40px; color: #444; text-transform: uppercase; }
        .f-play { font-size: 32px; font-weight: 900; text-align: center; margin-top: 40px; color: #fff; width: 80%; }
        .exit { position: absolute; top: 20px; right: 20px; padding: 10px 20px; cursor: pointer; font-weight: bold; }

        /* Diamond UI */
        .diamond { margin-top: 30px; display: flex; flex-direction: column; align-items: center; }
        .base { width: 30px; height: 30px; border: 4px solid #333; transform: rotate(45deg); margin: 6px; }
        .active-base { background: #fff; border-color: #fff; box-shadow: 0 0 15px #fff; }
    </style>
</head>
<body>

    <div id="top">
        <select id="league" onchange="loadData()">
            <option value="hockey/nhl">NHL</option>
            <option value="baseball/mlb">MLB</option>
            <option value="basketball/nba">NBA</option>
            <option value="football/nfl">NFL</option>
        </select>
        <div id="timer-box">REFRESH: <span id="t-val">3</span>s</div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 100px;">Status</th>
                <th style="width: 15%;">Away</th>
                <th style="width: 70px;">Score</th>
                <th style="width: 15%;">Home</th>
                <th style="width: 70px;">Score</th>
                <th>Clock / Last Play</th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>

    <div id="focus">
        <button class="exit" onclick="hideFocus()">EXIT [ESC]</button>
        <div id="f-clock" class="f-clock">--:--</div>
        <div style="display: flex; align-items: center; gap: 50px;">
            <div style="text-align:center;"><div id="f-a-t" class="f-abbr">AWAY</div><div id="f-a-s" class="f-score">0</div></div>
            <div style="font-size: 100px; color: #111;">-</div>
            <div style="text-align:center;"><div id="f-h-t" class="f-abbr">HOME</div><div id="f-h-s" class="f-score">0</div></div>
        </div>
        <div id="f-play" class="f-play"></div>
        <div id="f-diam" class="diamond"></div>
    </div>

    <script>
        let timer = 3;
        let activeId = null;

        async function loadData() {
            const league = document.getElementById('league').value;
            try {
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${league}/scoreboard`);
                const data = await res.json();
                render(data.events || []);
                if (activeId) updateFocus(data.events || []);
                timer = 3; // Reset timer
            } catch (e) { console.log("error"); }
        }

        function render(events) {
            const container = document.getElementById('rows');
            container.innerHTML = events.map(e => {
                const c = e.competitions[0];
                const h = c.competitors.find(x => x.homeAway === 'home');
                const a = c.competitors.find(x => x.homeAway === 'away');
                const isLive = e.status.type.state === 'in';
                
                return `
                    <tr onclick="showFocus('${e.id}')" class="${isLive ? 'live-row' : ''}">
                        <td><span class="badge ${isLive ? 'badge-red' : ''}">${isLive ? 'IN' : e.status.type.shortDetail}</span></td>
                        <td class="team">${a.team.abbreviation}</td>
                        <td class="score">${a.score}</td>
                        <td class="team">${h.team.abbreviation}</td>
                        <td class="score">${h.score}</td>
                        <td class="play">
                            <span style="color:${e.status.type.shortDetail.includes('(PP)') ? 'red' : 'black'}">${e.status.type.shortDetail}</span><br>
                            ${c.situation?.lastPlay?.text || ''}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateFocus(events) {
            const e = events.find(x => x.id === activeId);
            if (!e) return;
            const c = e.competitions[0];
            const sit = c.situation;
            const h = c.competitors.find(x => x.homeAway === 'home');
            const a = c.competitors.find(x => x.homeAway === 'away');

            document.getElementById('f-clock').innerText = e.status.type.shortDetail;
            document.getElementById('f-a-t').innerText = a.team.abbreviation;
            document.getElementById('f-h-t').innerText = h.team.abbreviation;
            document.getElementById('f-a-s').innerText = a.score;
            document.getElementById('f-h-s').innerText = h.score;

            // Signal Logic
            const playText = c.situation?.lastPlay?.text || "";
            const sigEl = document.getElementById('f-play');
            sigEl.innerText = playText.toUpperCase();
            sigEl.style.color = e.status.type.shortDetail.includes("(PP)") ? "var(--red)" : "#fff";

            // Diamond Logic
            const diam = document.getElementById('f-diam');
            if (document.getElementById('league').value.includes('mlb')) {
                diam.innerHTML = `
                    <div class="base ${sit?.onSecond ? 'active-base' : ''}"></div>
                    <div style="display:flex;">
                        <div class="base ${sit?.onThird ? 'active-base' : ''}"></div>
                        <div class="base ${sit?.onFirst ? 'active-base' : ''}"></div>
                    </div>
                    <div style="margin-top:10px; font-weight:bold; font-size:20px;">OUTS: ${sit?.outs || 0}</div>
                `;
            } else { diam.innerHTML = ""; }
        }

        function showFocus(id) { activeId = id; document.getElementById('focus').classList.add('active'); loadData(); }
        function hideFocus() { activeId = null; document.getElementById('focus').classList.remove('active'); }

        setInterval(() => {
            timer--;
            if (timer < 0) timer = 0;
            document.getElementById('t-val').innerText = timer;
            if (timer === 0) loadData();
        }, 1000);

        window.addEventListener('keydown', (e) => { if (e.key === "Escape") hideFocus(); });
        loadData();
    </script>
</body>
</html>
