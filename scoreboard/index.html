<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scoreboard // Signal Only</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; margin: 20px; background: #fff; color: #000; }
        .controls { margin-bottom: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; display: flex; justify-content: space-between; }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { text-align: left; border-bottom: 2px solid #000; padding: 10px; font-size: 11px; text-transform: uppercase; }
        td { padding: 12px 10px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f9f9f9; cursor: pointer; }
        .live { background: #fffbe6; }
        
        /* Focus Mode */
        #focus-mode { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; z-index: 9999; padding: 40px; box-sizing: border-box; 
        }
        .focus-content { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        .focus-score { font-size: 160px; font-weight: 900; display: flex; gap: 40px; align-items: center; line-height: 1; }
        .focus-team { font-size: 40px; color: #888; text-transform: uppercase; }
        
        /* Signal Indicators */
        .signal-box { margin-top: 40px; padding: 20px 40px; background: #000; color: #fff; font-size: 32px; font-weight: bold; text-align: center; min-width: 400px; }
        .alert-red { background: #ff0000 !important; color: #fff !important; }
        .base-diamond { font-family: monospace; font-size: 24px; color: #ccc; margin-top: 10px; }
        .base-active { color: #000; font-weight: bold; }
        
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 16px; font-weight: bold; cursor: pointer; border: 1px solid #000; padding: 5px 15px; }
    </style>
</head>
<body>

    <div class="controls">
        <div>
            <select id="league" onchange="fetchData()">
                <option value="hockey/nhl">NHL</option>
                <option value="baseball/mlb">MLB</option>
                <option value="basketball/nba">NBA</option>
                <option value="football/nfl">NFL</option>
            </select>
            | <span id="timer">5</span>s
        </div>
        <div id="status-light">SYNCED</div>
    </div>

    <table id="main-table">
        <thead>
            <tr>
                <th style="width: 80px;">Status</th>
                <th>Away</th>
                <th style="width: 60px;">Score</th>
                <th>Home</th>
                <th style="width: 60px;">Score</th>
                <th>Signal / Situation</th>
            </tr>
        </thead>
        <tbody id="data-body"></tbody>
    </table>

    <div id="focus-mode">
        <div class="close-btn" onclick="exitFocus()">CLOSE [ESC]</div>
        <div class="focus-content">
            <div id="f-clock" style="font-size: 24px; font-weight: bold;">--:--</div>
            <div class="focus-score">
                <div style="text-align:right;"><div id="f-away-t" class="focus-team">AWAY</div><div id="f-away-s">0</div></div>
                <div style="color:#eee;">-</div>
                <div style="text-align:left;"><div id="f-home-t" class="focus-team">HOME</div><div id="f-home-s">0</div></div>
            </div>
            <div id="f-signal" class="signal-box">STABLE SIGNAL</div>
            <div id="f-extra" class="base-diamond"></div>
        </div>
    </div>

    <script>
        let seconds = 5;
        let activeId = null;

        async function fetchData() {
            const league = document.getElementById('league').value;
            try {
                const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${league}/scoreboard`);
                const data = await res.json();
                render(data.events || []);
                if (activeId) updateFocus(data.events || []);
                seconds = 5;
            } catch (e) { document.getElementById('status-light').innerText = "OFFLINE"; }
        }

        // Clean up text - remove "pitches to", "giveaway by", etc.
        function filterSignalText(text) {
            if (!text) return "";
            if (text.includes("pitches to")) return "At Bat";
            if (text.includes("Giveaway")) return "Live Play";
            return text;
        }

        function render(events) {
            const tbody = document.getElementById('data-body');
            tbody.innerHTML = events.map(e => {
                const c = e.competitions[0];
                const home = c.competitors.find(x => x.homeAway === 'home');
                const away = c.competitors.find(x => x.homeAway === 'away');
                const isLive = e.status.type.state === 'in';
                const signal = filterSignalText(c.situation?.lastPlay?.text);
                const isPP = e.status.type.shortDetail.includes("(PP)");

                return `
                    <tr class="${isLive ? 'live' : ''}" onclick="enterFocus('${e.id}')">
                        <td>${e.status.type.state.toUpperCase()}</td>
                        <td>${away.team.abbreviation}</td>
                        <td><strong>${away.score}</strong></td>
                        <td>${home.team.abbreviation}</td>
                        <td><strong>${home.score}</strong></td>
                        <td style="font-size: 12px;">
                            <span style="color:${isPP ? 'red' : 'black'}; font-weight:bold;">${e.status.type.shortDetail}</span><br>
                            ${signal}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function enterFocus(id) {
            activeId = id;
            document.getElementById('focus-mode').style.display = 'block';
            fetchData();
        }

        function exitFocus() { activeId = null; document.getElementById('focus-mode').style.display = 'none'; }

        function updateFocus(events) {
            const e = events.find(x => x.id === activeId);
            if (!e) return;
            const c = e.competitions[0];
            const sit = c.situation;
            const home = c.competitors.find(x => x.homeAway === 'home');
            const away = c.competitors.find(x => x.homeAway === 'away');
            
            document.getElementById('f-away-t').innerText = away.team.abbreviation;
            document.getElementById('f-away-s').innerText = away.score;
            document.getElementById('f-home-t').innerText = home.team.abbreviation;
            document.getElementById('f-home-s').innerText = home.score;
            document.getElementById('f-clock').innerText = e.status.type.shortDetail;

            const sigBox = document.getElementById('f-signal');
            const extra = document.getElementById('f-extra');
            sigBox.className = "signal-box";
            extra.innerHTML = "";

            // SPORT SPECIFIC LOGIC
            if (document.getElementById('league').value === 'hockey/nhl') {
                if (e.status.type.shortDetail.includes("(PP)")) {
                    sigBox.innerText = "POWER PLAY";
                    sigBox.classList.add('alert-red');
                } else if (sit?.lastPlay?.text.includes("Empty Net")) {
                    sigBox.innerText = "EMPTY NET";
                    sigBox.classList.add('alert-red');
                } else {
                    sigBox.innerText = "EVEN STRENGTH";
                }
            } 
            else if (document.getElementById('league').value === 'baseball/mlb') {
                const b1 = sit?.onFirst ? "●" : "○";
                const b2 = sit?.onSecond ? "●" : "○";
                const b3 = sit?.onThird ? "●" : "○";
                extra.innerHTML = `<div style="font-size:40px;">&nbsp;${b2}&nbsp;<br>${b3}&nbsp;&nbsp;&nbsp;${b1}</div><div>OUTS: ${sit?.outs || 0}</div>`;
                
                if (sit?.onFirst && sit?.onSecond && sit?.onThird) {
                    sigBox.innerText = "BASES LOADED";
                    sigBox.classList.add('alert-red');
                } else {
                    sigBox.innerText = "IN PLAY";
                }
            }
            else {
                sigBox.innerText = filterSignalText(sit?.lastPlay?.text) || "LIVE";
            }
        }

        setInterval(() => {
            seconds--;
            document.getElementById('timer').innerText = seconds;
            if (seconds <= 0) fetchData();
        }, 1000);

        window.addEventListener('keydown', (e) => { if (e.key === "Escape") exitFocus(); });
        fetchData();
    </script>
</body>
</html>
