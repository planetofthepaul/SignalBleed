<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SignalBleed // Plain Scoreboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; color: #333; background: #fff; margin: 0; }
        #top-bar { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
        
        /* The Table - Fixed Alignment */
        table { width: 100%; border-collapse: collapse; cursor: pointer; }
        th { text-align: left; font-size: 0.75rem; text-transform: uppercase; padding: 10px; border-bottom: 2px solid #333; background: #f9f9f9; }
        td { padding: 12px 10px; border-bottom: 1px solid #eee; }
        .live-row { background: #fff9c4; font-weight: bold; }
        
        /* Badges */
        .status-badge { font-size: 0.7rem; padding: 2px 5px; border: 1px solid #333; font-weight: bold; background: #eee; }
        .live-tag { background: #ff5252; color: white; border: none; }
        .pp-tag { color: #ff0000; font-weight: 900; margin-left: 5px; }

        /* Focus Mode Overlay */
        #focus-mode { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; z-index: 1000; flex-direction: column; padding: 40px; box-sizing: border-box;
        }
        #focus-mode.active { display: flex; }
        .focus-score { font-size: 10rem; font-weight: 900; line-height: 1; }
        .focus-team { font-size: 3rem; color: #666; }
        .focus-situation { background: #f0f0f0; padding: 30px; font-size: 2rem; border-left: 10px solid #000; margin-top: 40px; }
        .exit-btn { position: absolute; top: 20px; right: 20px; padding: 10px 20px; cursor: pointer; font-weight: bold; }

        #log { margin-top: 20px; font-family: monospace; font-size: 0.8rem; color: #888; border-top: 1px solid #ddd; padding-top: 10px; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div>
            <strong>SIGNAL_BLEED</strong> // 
            <select id="league" onchange="fetchScores()">
                <option value="hockey/nhl">NHL</option>
                <option value="basketball/nba">NBA</option>
                <option value="football/nfl">NFL</option>
                <option value="baseball/mlb">MLB</option>
            </select>
        </div>
        <div>REFRESH_IN: <span id="timer">5</span>s</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>State</th>
                <th>Away</th>
                <th>Score</th>
                <th>Home</th>
                <th>Score</th>
                <th>Clock / Situation</th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>

    <div id="log"></div>

    <div id="focus-mode">
        <button class="exit-btn" onclick="closeFocus()">[ESC] EXIT FOCUS</button>
        <div style="display: flex; justify-content: space-between; align-items: center; flex-grow: 1;">
            <div style="text-align: center;">
                <div id="f-away-t" class="focus-team">AWAY</div>
                <div id="f-away-s" class="focus-score">0</div>
            </div>
            <div style="font-size: 4rem; color: #ccc;">VS</div>
            <div style="text-align: center;">
                <div id="f-home-t" class="focus-team">HOME</div>
                <div id="f-home-s" class="focus-score">0</div>
            </div>
        </div>
        <div id="f-clock" style="font-size: 2rem; font-weight: bold; margin-bottom: 10px;">--:--</div>
        <div id="f-sit" class="focus-situation">WAITING FOR SIGNAL...</div>
    </div>

    <script>
        let countdown = 5;
        let activeGameId = null;
        let signalLog = [];

        async function fetchScores() {
            const league = document.getElementById('league').value;
            const url = `https://site.api.espn.com/apis/site/v2/sports/${league}/scoreboard`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                render(data.events);
                if (activeGameId) updateFocus(data.events);
                countdown = 5;
            } catch (e) { console.error("Signal Drop:", e); }
        }

        function render(events) {
            const container = document.getElementById('rows');
            container.innerHTML = '';
            
            events.forEach(event => {
                const game = event.competitions[0];
                const state = event.status.type.state;
                const home = game.competitors.find(c => c.homeAway === 'home');
                const away = game.competitors.find(c => c.homeAway === 'away');
                const isPP = event.status.type.shortDetail.includes("(PP)");

                const tr = document.createElement('tr');
                if (state === 'in') tr.className = 'live-row';
                tr.onclick = () => openFocus(event.id);

                tr.innerHTML = `
                    <td><span class="status-badge ${state === 'in' ? 'live-tag' : ''}">${state.toUpperCase()}</span></td>
                    <td>${away.team.abbreviation}</td>
                    <td>${away.score}</td>
                    <td>${home.team.abbreviation}</td>
                    <td>${home.score}</td>
                    <td>
                        <div>${event.status.type.shortDetail} ${isPP ? '<span class="pp-tag">[PP]</span>' : ''}</div>
                        <div style="font-size: 0.7rem; color: #666;">${game.situation?.lastPlay?.text || ''}</div>
                    </td>
                `;
                container.appendChild(tr);
            });
        }

        function openFocus(id) {
            activeGameId = id;
            document.getElementById('focus-mode').classList.add('active');
            fetchScores();
        }

        function closeFocus() {
            activeGameId = null;
            document.getElementById('focus-mode').classList.remove('active');
        }

        function updateFocus(events) {
            const e = events.find(x => x.id === activeGameId);
            if (!e) return;
            const g = e.competitions[0];
            const h = g.competitors.find(c => c.homeAway === 'home');
            const a = g.competitors.find(c => c.homeAway === 'away');

            document.getElementById('f-away-t').innerText = a.team.abbreviation;
            document.getElementById('f-away-s').innerText = a.score;
            document.getElementById('f-home-t').innerText = h.team.abbreviation;
            document.getElementById('f-home-s').innerText = h.score;
            document.getElementById('f-clock').innerText = e.status.type.shortDetail;
            document.getElementById('f-sit').innerText = (g.situation?.lastPlay?.text || "STABLE // NO NEW SIGNAL").toUpperCase();
            
            // Highlight Focus if something critical happens
            if (e.status.type.shortDetail.includes("(PP)")) {
                document.getElementById('f-sit').style.backgroundColor = "#ffebee";
                document.getElementById('f-sit').style.color = "#d32f2f";
            } else {
                document.getElementById('f-sit').style.backgroundColor = "#f0f0f0";
                document.getElementById('f-sit').style.color = "#333";
            }
        }

        setInterval(() => {
            countdown--;
            document.getElementById('timer').innerText = countdown;
            if (countdown <= 0) fetchScores();
        }, 1000);

        window.addEventListener('keydown', (e) => { if (e.key === "Escape") closeFocus(); });
        fetchScores();
    </script>
</body>
</html>
