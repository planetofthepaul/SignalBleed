<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDGE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');

  :root {
    --bg: #f2f2f4;
    --surface: #fff;
    --border: #ddd;
    --text: #111;
    --dim: #888;
    --red: #d42020;
    --red-light: rgba(212,32,32,0.08);
    --amber: #b37400;
    --amber-light: rgba(179,116,0,0.08);
    --green: #1a8a1a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'JetBrains Mono',monospace; background:var(--bg); color:var(--text); min-height:100vh; }

  /* ── HEADER ── */
  header {
    position:sticky; top:0; z-index:50; background:#fff;
    border-bottom:2px solid #111; padding:10px 16px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo { font-size:12px; font-weight:800; letter-spacing:5px; color:var(--red); }
  .controls { display:flex; gap:6px; align-items:center; }
  .lbtn {
    background:none; border:1.5px solid var(--border); color:var(--dim);
    padding:5px 12px; font-family:inherit; font-size:11px; font-weight:700;
    cursor:pointer; letter-spacing:1px;
  }
  .lbtn:hover { color:var(--text); border-color:#999; }
  .lbtn.on { color:#fff; background:var(--text); border-color:var(--text); }
  .snd {
    background:none; border:1.5px solid var(--border); color:var(--dim);
    padding:5px 8px; font-size:13px; cursor:pointer;
  }
  .snd.on { color:var(--amber); border-color:var(--amber); }
  .freshness {
    font-size:10px; color:var(--dim); font-weight:700;
    min-width:70px; text-align:right;
  }
  .freshness.stale { color:var(--red); }

  main { padding:10px 16px; max-width:920px; margin:0 auto; }

  /* ── GAME CARD (always expanded for live) ── */
  .game {
    background:var(--surface);
    border:1.5px solid var(--border);
    margin-bottom:6px;
    padding:14px 18px 10px;
    position:relative; overflow:hidden;
    cursor:pointer;
  }
  .game:hover { border-color:#aaa; }

  .game-top {
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
  }

  .side { display:flex; align-items:center; gap:12px; }
  .side.away { justify-content:flex-end; }
  .side.home { justify-content:flex-start; }

  .abbr { font-size:18px; font-weight:800; letter-spacing:1px; color:var(--text); }
  .abbr.losing { color:var(--dim); }
  .abbr.batting { border-bottom:3px solid var(--amber); padding-bottom:2px; }

  .num {
    font-size:34px; font-weight:800; line-height:1;
    min-width:48px; text-align:center; color:var(--text);
    transition: color 0.3s, transform 0.3s;
  }
  .num.losing { color:var(--dim); }

  .mid {
    display:flex; flex-direction:column; align-items:center;
    gap:2px; padding:0 14px; min-width:100px;
  }
  .clock { font-size:12px; font-weight:700; color:var(--dim); }
  .clock.live { color:var(--text); }

  /* Momentum tags — static, no pulse */
  .mtag {
    font-size:9px; font-weight:800; letter-spacing:2px; padding:2px 7px;
    display:inline-block; margin-top:2px;
  }
  .mtag.red { color:var(--red); border:1.5px solid var(--red); background:var(--red-light); }
  .mtag.amber { color:var(--amber); border:1.5px solid var(--amber); background:var(--amber-light); }

  /* ── DETAIL STRIP (always visible for live) ── */
  .detail-strip {
    display:flex; gap:16px; align-items:center; flex-wrap:wrap;
    margin-top:10px; padding-top:8px;
    border-top:1px solid #eee;
    font-size:11px; color:var(--text);
  }
  .d-item { display:flex; gap:5px; align-items:center; }
  .d-label { color:var(--dim); font-weight:700; font-size:9px; letter-spacing:1px; text-transform:uppercase; }
  .d-val { font-weight:700; }

  /* Inline diamond */
  .d-diamond {
    display:inline-grid;
    grid-template-areas:". s ." "t . f";
    gap:1px; vertical-align:middle;
  }
  .d-bd { width:10px; height:10px; border:2px solid #bbb; transform:rotate(45deg); }
  .d-bd.on { background:var(--amber); border-color:var(--amber); }
  .d-bd.s { grid-area:s; } .d-bd.t { grid-area:t; } .d-bd.f { grid-area:f; }

  /* Focus button */
  .focus-btn {
    margin-left:auto;
    background:var(--text); color:#fff; border:none;
    padding:5px 12px; font-family:inherit; font-size:10px;
    font-weight:700; letter-spacing:1px; cursor:pointer;
  }
  .focus-btn:hover { background:var(--red); }

  /* ── SCORE FLASH — only on change, not constant ── */
  .game.flash { border-color:var(--red) !important; }
  .game.flash::after {
    content:''; position:absolute; inset:0;
    background:rgba(212,32,32,0.12);
    animation:flashout 2.5s ease-out forwards;
    pointer-events:none;
  }
  @keyframes flashout { 0%{opacity:1} 100%{opacity:0} }
  .num.just { color:var(--red)!important; transform:scale(1.12); }

  /* ── NON-LIVE ── */
  .game.off { opacity:0.35; padding:8px 18px; cursor:default; }
  .game.off:hover { opacity:0.5; border-color:var(--border); }
  .game.off .abbr { font-size:13px; }
  .game.off .num { font-size:18px; min-width:28px; }

  /* ── PINNED ── */
  .game.pinned { border-left:4px solid var(--amber); }
  .pin {
    position:absolute; top:5px; right:8px;
    background:none; border:none; color:#ccc;
    font-size:14px; cursor:pointer; opacity:0;
  }
  .game:hover .pin { opacity:0.6; }
  .pin:hover { opacity:1!important; color:var(--amber); }
  .pin.on { color:var(--amber); opacity:1!important; }

  .label { font-size:9px; font-weight:700; letter-spacing:3px; color:var(--dim); margin:18px 0 6px 2px; }

  /* ═══════ FOCUS MODE ═══════ */
  #focus {
    display:none; position:fixed; inset:0; background:#000;
    z-index:100; flex-direction:column; align-items:center;
    overflow-y:auto;
  }
  #focus.open { display:flex; }

  .f-top {
    width:100%; max-width:800px; padding:60px 20px 20px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }

  .f-clock { font-size:20px; font-weight:700; color:#aaa; }
  .f-clock.live { color:#eee; }

  .f-scores { display:flex; align-items:center; gap:36px; }
  .f-team { text-align:center; }
  .f-abbr { font-size:28px; font-weight:800; color:#666; letter-spacing:2px; }
  .f-abbr.w { color:#eee; }
  .f-abbr.batting { border-bottom:3px solid var(--amber); padding-bottom:3px; }
  .f-num {
    font-size:130px; font-weight:800; line-height:1; color:#555;
    transition: color 0.3s;
  }
  .f-num.w { color:#fff; }
  .f-num.just { color:var(--red)!important; text-shadow:0 0 30px rgba(212,32,32,0.4); }
  .f-dash { font-size:50px; color:#333; }

  .f-mtag {
    font-size:14px; font-weight:800; letter-spacing:3px;
    padding:4px 14px; margin-top:6px;
  }
  .f-mtag.red { color:var(--red); border:2px solid var(--red); }
  .f-mtag.amber { color:var(--amber); border:2px solid var(--amber); }

  /* Focus situation row */
  .f-detail {
    display:flex; gap:20px; align-items:center; flex-wrap:wrap;
    margin-top:14px; padding:10px 16px;
    background:rgba(255,255,255,0.04); border:1px solid #222;
    font-size:13px; color:#ccc; max-width:700px;
  }
  .f-detail .d-label { color:#777; }
  .f-detail .d-val { color:#eee; font-weight:700; }
  .f-detail .d-bd { border-color:#555; }
  .f-detail .d-bd.on { background:var(--amber); border-color:var(--amber); }

  /* Focus play feed */
  .f-feed {
    width:100%; max-width:700px;
    margin-top:16px; padding:12px 16px;
    background:rgba(255,255,255,0.03); border:1px solid #222;
    max-height:300px; overflow-y:auto;
  }
  .f-feed-title {
    font-size:10px; font-weight:700; letter-spacing:2px; color:#555;
    margin-bottom:8px;
  }
  .f-play {
    font-size:12px; color:#bbb; padding:4px 0;
    border-bottom:1px solid #1a1a1a;
    line-height:1.5;
  }
  .f-play:first-of-type { color:#fff; font-weight:700; }
  .f-play .f-play-time { color:#555; font-size:10px; margin-right:8px; }

  .f-exit {
    position:fixed; top:16px; right:20px;
    background:none; border:1px solid #444; color:#888;
    padding:8px 16px; font-family:inherit; font-size:11px; font-weight:700;
    cursor:pointer; letter-spacing:1px; z-index:101;
  }
  .f-exit:hover { color:#fff; border-color:#888; }

  #focus.f-flash { animation:f-flashout 2s ease-out forwards; }
  @keyframes f-flashout { 0%{background:#1a0000} 100%{background:#000} }

  /* ── TOASTS ── */
  #toasts {
    position:fixed; top:52px; right:12px; z-index:200;
    display:flex; flex-direction:column; gap:6px;
  }
  .toast {
    padding:8px 14px; font-family:inherit; font-size:12px; font-weight:700;
    letter-spacing:0.5px; max-width:300px;
    animation:tin 0.2s ease-out, tout 0.4s ease-in 3s forwards;
  }
  .toast.score { background:var(--red); color:#fff; }
  .toast.event { background:var(--amber); color:#fff; }
  @keyframes tin { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
  @keyframes tout { from{opacity:1} to{opacity:0} }

  .empty-msg { text-align:center; padding:50px 20px; color:var(--dim); font-size:12px; }

  @media(max-width:600px) {
    .num { font-size:26px; min-width:34px; }
    .abbr { font-size:14px; }
    .mid { min-width:70px; padding:0 8px; }
    .game { padding:10px 12px; }
    .f-num { font-size:70px; }
    .f-abbr { font-size:18px; }
    .detail-strip { font-size:10px; gap:10px; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">EDGE</span>
  <div class="controls">
    <button class="lbtn" data-l="baseball/mlb" onclick="pick(this)">MLB</button>
    <button class="lbtn" data-l="football/nfl" onclick="pick(this)">NFL</button>
    <button class="lbtn on" data-l="hockey/nhl" onclick="pick(this)">NHL</button>
    <button class="lbtn" data-l="basketball/nba" onclick="pick(this)">NBA</button>
    <button class="snd" id="snd" onclick="togSnd()">🔇</button>
    <div class="freshness" id="fresh">—</div>
  </div>
</header>

<main>
  <div id="pinned-area"></div>
  <div id="live-label" class="label" style="display:none">LIVE</div>
  <div id="live"></div>
  <div id="other-label" class="label" style="display:none">OTHER</div>
  <div id="other"></div>
</main>

<div id="focus">
  <button class="f-exit" onclick="closeFocus()">ESC ✕</button>
  <div class="f-top">
    <div id="f-clock" class="f-clock">--</div>
    <div class="f-scores">
      <div class="f-team"><div id="f-a-abbr" class="f-abbr">AWY</div><div id="f-a-num" class="f-num">0</div></div>
      <div class="f-dash">–</div>
      <div class="f-team"><div id="f-h-abbr" class="f-abbr">HME</div><div id="f-h-num" class="f-num">0</div></div>
    </div>
    <div id="f-mtag-wrap"></div>
    <div id="f-detail" class="f-detail" style="display:none"></div>
    <div id="f-feed" class="f-feed" style="display:none">
      <div class="f-feed-title">PLAY-BY-PLAY</div>
      <div id="f-feed-list"></div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
  let L='hockey/nhl', prev={}, prevSit={}, snd=false, evts=[], ctx=null;
  let focusId=null, fetching=false, lastFetchTime=0;
  let pins=new Set(JSON.parse(localStorage.getItem('ep')||'[]'));
  // Store recent plays per game for focus feed
  let playLog={};

  function beep(f=880,d=0.12,n=2){
    if(!snd)return;
    if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<n;i++){
      setTimeout(()=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.frequency.value=f;o.type='square';
        g.gain.setValueAtTime(0.06,ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+d);
        o.start();o.stop(ctx.currentTime+d);
      },i*180);
    }
  }
  function togSnd(){
    snd=!snd;
    const b=document.getElementById('snd');
    b.textContent=snd?'🔊':'🔇';
    b.classList.toggle('on',snd);
    if(snd&&!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();
  }
  function pick(el){
    document.querySelectorAll('.lbtn').forEach(b=>b.classList.remove('on'));
    el.classList.add('on');
    L=el.dataset.l; prev={}; prevSit={}; playLog={};
    go();
  }
  function togPin(ev,id){
    ev.stopPropagation();
    pins.has(id)?pins.delete(id):pins.add(id);
    localStorage.setItem('ep',JSON.stringify([...pins]));
    draw();
  }
  function toast(msg,type='score'){
    const c=document.getElementById('toasts');
    const t=document.createElement('div');
    t.className='toast '+type; t.textContent=msg;
    c.appendChild(t); setTimeout(()=>t.remove(),3500);
  }

  // Freshness ticker
  function updateFresh(){
    if(!lastFetchTime){document.getElementById('fresh').textContent='—';return;}
    const ago=Math.round((Date.now()-lastFetchTime)/1000);
    const el=document.getElementById('fresh');
    el.textContent=ago+'s ago';
    el.classList.toggle('stale',ago>5);
  }
  setInterval(updateFresh,500);

  function getBat(e){
    const s=e.competitions[0].situation;
    if(!s)return null;
    if(s.topInning===true)return'away';
    if(s.topInning===false)return'home';
    const d=e.status.type.shortDetail||'';
    if(d.includes('Top'))return'away';
    if(d.includes('Bot')||d.includes('Mid'))return'home';
    return null;
  }

  function getMtag(e){
    const c=e.competitions[0],s=c.situation,d=e.status.type.shortDetail||'',sp=L.split('/')[1];
    if(sp==='nhl'){
      if(d.includes('PP')||d.includes('Power Play'))return{t:'POWER PLAY',c:'red'};
      if((s?.lastPlay?.text||'').toLowerCase().includes('empty net'))return{t:'EMPTY NET',c:'red'};
    }
    if(sp==='mlb'){
      if(s?.onFirst&&s?.onSecond&&s?.onThird)return{t:'BASES LOADED',c:'amber'};
      if(s?.onSecond||s?.onThird)return{t:'SCORING POS',c:'amber'};
    }
    if(sp==='nba'){
      const diff=Math.abs(parseInt(c.competitors[0].score||0)-parseInt(c.competitors[1].score||0));
      if(diff<=5&&(parseInt(e.status.period)||0)>=4)return{t:'CLUTCH',c:'amber'};
    }
    if(sp==='nfl'){
      if(s?.isRedZone)return{t:'RED ZONE',c:'red'};
      if(s?.down===4)return{t:'4TH DOWN',c:'amber'};
    }
    return null;
  }

  function detailHTML(e){
    const c=e.competitions[0],sit=c.situation,sp=L.split('/')[1];
    let items='';
    if(sp==='nhl'){
      items+=`<div class="d-item"><span class="d-label">Per</span><span class="d-val">${e.status.period||'—'}</span></div>`;
    }
    if(sp==='mlb'&&sit){
      items+=`<div class="d-item"><div class="d-diamond"><div class="d-bd s ${sit.onSecond?'on':''}"></div><div class="d-bd t ${sit.onThird?'on':''}"></div><div class="d-bd f ${sit.onFirst?'on':''}"></div></div></div>`;
      items+=`<div class="d-item"><span class="d-label">Out</span><span class="d-val">${sit.outs||0}</span></div>`;
      if(sit.balls!==undefined)items+=`<div class="d-item"><span class="d-label">Count</span><span class="d-val">${sit.balls}-${sit.strikes}</span></div>`;
      if(sit.batter?.athlete?.shortName)items+=`<div class="d-item"><span class="d-label">AB</span><span class="d-val">${sit.batter.athlete.shortName}</span></div>`;
      if(sit.pitcher?.athlete?.shortName)items+=`<div class="d-item"><span class="d-label">P</span><span class="d-val">${sit.pitcher.athlete.shortName}</span></div>`;
    }
    if(sp==='nba'){
      items+=`<div class="d-item"><span class="d-label">Qtr</span><span class="d-val">${e.status.period||'—'}</span></div>`;
    }
    if(sp==='nfl'&&sit){
      if(sit.downDistanceText)items+=`<div class="d-item"><span class="d-label">Down</span><span class="d-val">${sit.downDistanceText}</span></div>`;
      if(sit.possessionText)items+=`<div class="d-item"><span class="d-label">Poss</span><span class="d-val">${sit.possessionText}</span></div>`;
    }
    return items;
  }

  function card(e,off=false){
    const c=e.competitions[0];
    const h=c.competitors.find(x=>x.homeAway==='home');
    const a=c.competitors.find(x=>x.homeAway==='away');
    const live=e.status.type.state==='in';
    const hs=parseInt(h.score||0),as=parseInt(a.score||0);
    const hw=hs>as,aw=as>hs;
    const k=e.id;
    const hj=prev[k+'h']!==undefined&&hs>prev[k+'h'];
    const aj=prev[k+'a']!==undefined&&as>prev[k+'a'];
    const flash=hj||aj;
    const p=pins.has(e.id);
    const m=live?getMtag(e):null;
    const isPost=e.status.type.state==='post';
    const clockText=live?e.status.type.shortDetail:(isPost?'FINAL':e.status.type.shortDetail);
    const bat=(L.includes('mlb')&&live)?getBat(e):null;

    const mHTML=m?`<div class="mtag ${m.c}">${m.t}</div>`:'';

    // Detail strip — always shown for live games
    let strip='';
    if(live){
      const dHTML=detailHTML(e);
      strip=`<div class="detail-strip">${dHTML}<button class="focus-btn" onclick="event.stopPropagation();openFocus('${e.id}')">FOCUS ▸</button></div>`;
    }

    return`
      <div class="game ${off?'off':''} ${flash?'flash':''} ${p?'pinned':''}" id="g-${e.id}" onclick="${live?`openFocus('${e.id}')`:''}">
        <button class="pin ${p?'on':''}" onclick="togPin(event,'${e.id}')">★</button>
        <div class="game-top">
          <div class="side away">
            <span class="abbr ${aw?'':'losing'} ${bat==='away'?'batting':''}">${a.team.abbreviation}</span>
            <span class="num ${aw?'':'losing'} ${aj?'just':''}">${a.score||'–'}</span>
          </div>
          <div class="mid">
            <div class="clock ${live?'live':''}">${clockText}</div>
            ${mHTML}
          </div>
          <div class="side home">
            <span class="num ${hw?'':'losing'} ${hj?'just':''}">${h.score||'–'}</span>
            <span class="abbr ${hw?'':'losing'} ${bat==='home'?'batting':''}">${h.team.abbreviation}</span>
          </div>
        </div>
        ${strip}
      </div>`;
  }

  // ── FOCUS ──
  function openFocus(id){
    focusId=id;
    document.getElementById('focus').classList.add('open');
    renderFocus();
  }
  function closeFocus(){
    focusId=null;
    document.getElementById('focus').classList.remove('open','f-flash');
  }

  function renderFocus(){
    if(!focusId)return;
    const e=evts.find(x=>x.id===focusId);
    if(!e)return;
    const c=e.competitions[0];
    const h=c.competitors.find(x=>x.homeAway==='home');
    const a=c.competitors.find(x=>x.homeAway==='away');
    const live=e.status.type.state==='in';
    const hs=parseInt(h.score||0),as=parseInt(a.score||0);
    const hw=hs>as,aw=as>hs;
    const k=e.id;
    const hj=prev[k+'h']!==undefined&&hs>prev[k+'h'];
    const aj=prev[k+'a']!==undefined&&as>prev[k+'a'];
    const m=live?getMtag(e):null;
    const bat=(L.includes('mlb')&&live)?getBat(e):null;
    const clockText=live?e.status.type.shortDetail:(e.status.type.state==='post'?'FINAL':e.status.type.shortDetail);

    document.getElementById('f-clock').textContent=clockText;
    document.getElementById('f-clock').className='f-clock'+(live?' live':'');

    const faA=document.getElementById('f-a-abbr');
    faA.textContent=a.team.abbreviation;
    faA.className='f-abbr'+(aw?' w':'')+(bat==='away'?' batting':'');
    document.getElementById('f-a-num').textContent=a.score||'0';
    document.getElementById('f-a-num').className='f-num'+(aw?' w':'')+(aj?' just':'');

    const fhA=document.getElementById('f-h-abbr');
    fhA.textContent=h.team.abbreviation;
    fhA.className='f-abbr'+(hw?' w':'')+(bat==='home'?' batting':'');
    document.getElementById('f-h-num').textContent=h.score||'0';
    document.getElementById('f-h-num').className='f-num'+(hw?' w':'')+(hj?' just':'');

    document.getElementById('f-mtag-wrap').innerHTML=m?`<div class="f-mtag ${m.c}">${m.t}</div>`:'';

    // Detail row
    const fd=document.getElementById('f-detail');
    const dHTML=detailHTML(e);
    if(dHTML){fd.innerHTML=dHTML;fd.style.display='flex';}
    else fd.style.display='none';

    // Play feed
    const ff=document.getElementById('f-feed');
    const log=playLog[e.id]||[];
    if(log.length){
      ff.style.display='block';
      document.getElementById('f-feed-list').innerHTML=log.map((p,i)=>
        `<div class="f-play">${i===0?'':'<span class="f-play-time">'+p.time+'</span>'}${i===0?'<span class="f-play-time">'+p.time+' </span>':''}${p.text}</div>`
      ).join('');
    } else ff.style.display='none';

    if(hj||aj){
      const f=document.getElementById('focus');
      f.classList.remove('f-flash'); void f.offsetWidth; f.classList.add('f-flash');
    }
  }

  function draw(){
    const liveE=evts.filter(e=>e.status.type.state==='in');
    const otherE=evts.filter(e=>e.status.type.state!=='in');
    const pinnedE=evts.filter(e=>pins.has(e.id));
    const unpinLive=liveE.filter(e=>!pins.has(e.id));
    const unpinOther=otherE.filter(e=>!pins.has(e.id));

    document.getElementById('pinned-area').innerHTML=pinnedE.length
      ?'<div class="label">WATCHING</div>'+pinnedE.map(e=>card(e)).join(''):'';

    document.getElementById('live-label').style.display=unpinLive.length?'':'none';
    document.getElementById('live').innerHTML=unpinLive.length
      ?unpinLive.map(e=>card(e)).join('')
      :(pinnedE.length?'':'<div class="empty-msg">No live games</div>');

    document.getElementById('other-label').style.display=unpinOther.length?'':'none';
    document.getElementById('other').innerHTML=unpinOther.map(e=>card(e,true)).join('');

    renderFocus();
  }

  async function go(){
    if(fetching)return;
    fetching=true;
    try{
      const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/${L}/scoreboard`);
      const d=await r.json();
      evts=d.events||[];
      lastFetchTime=Date.now();

      evts.forEach(e=>{
        const c=e.competitions[0];
        const h=c.competitors.find(x=>x.homeAway==='home');
        const a=c.competitors.find(x=>x.homeAway==='away');
        const hs=parseInt(h.score||0),as=parseInt(a.score||0);
        const k=e.id;
        const sit=c.situation;

        // Score alerts
        if(prev[k+'h']!==undefined){
          if(hs>prev[k+'h']){toast(`⚡ ${h.team.abbreviation} SCORES — ${as}–${hs}`);beep(880,0.12,3);}
          if(as>prev[k+'a']){toast(`⚡ ${a.team.abbreviation} SCORES — ${as}–${hs}`);beep(880,0.12,3);}
        }

        // Momentum alerts
        const det=e.status.type.shortDetail||'';
        const pdet=prevSit[k+'d']||'';
        if(det.includes('PP')&&!pdet.includes('PP')){toast('⚠ POWER PLAY','event');beep(660,0.1,2);}
        if(L.includes('mlb')&&sit){
          const bases=`${sit.onFirst?1:0}${sit.onSecond?1:0}${sit.onThird?1:0}`;
          if(bases==='111'&&prevSit[k+'b']!=='111'){toast('⚠ BASES LOADED','event');beep(660,0.1,2);}
          prevSit[k+'b']=bases;
        }

        // Track plays for focus feed
        const playText=sit?.lastPlay?.text||'';
        if(playText){
          if(!playLog[e.id])playLog[e.id]=[];
          const last=playLog[e.id][0];
          if(!last||last.text!==playText){
            playLog[e.id].unshift({text:playText,time:det});
            if(playLog[e.id].length>20)playLog[e.id].pop();
          }
        }

        prev[k+'h']=hs;prev[k+'a']=as;prevSit[k+'d']=det;
      });

      draw();
      setTimeout(()=>{
        document.querySelectorAll('.just').forEach(el=>el.classList.remove('just'));
        document.querySelectorAll('.flash').forEach(el=>el.classList.remove('flash'));
      },2500);
    }catch(err){console.error(err);}
    fetching=false;
  }

  async function loop(){await go();setTimeout(loop,1500);}
  loop();

  window.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(focusId)closeFocus();}
    if(e.key==='s'||e.key==='S')togSnd();
  });
</script>
</body>
</html>
